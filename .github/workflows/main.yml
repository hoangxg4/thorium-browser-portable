name: Build Thorium Portable

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Check versions and release
      id: check
      run: |
        $thorium = Invoke-RestMethod "https://api.github.com/repos/Alex313031/Thorium-Win/releases/latest"
        $thorium_tag = $thorium.tag_name
        $thorium_ver = $thorium_tag -replace '^M', ''
        
        $plus = Invoke-RestMethod "https://api.github.com/repos/bibicadotnet/Chromium_SetDLL/releases/latest"
        $plus_ver = $plus.tag_name -replace '^v',''
        $plus_url = ($plus.assets | Where-Object { $_.name -like "Chrome*.7z" }).browser_download_url
        
        $tag = "thorium-portable-x64_${thorium_ver}_${plus_ver}"
        
        echo "THORIUM_VER=$thorium_ver" >> $env:GITHUB_ENV
        echo "THORIUM_TAG=$thorium_tag" >> $env:GITHUB_ENV
        $thorium_asset = $thorium.assets | Where-Object { $_.name -like "*AVX2*.zip*" } | Select-Object -First 1
        echo "THORIUM_URL=$($thorium_asset.browser_download_url)" >> $env:GITHUB_ENV
        echo "PLUS_VER=$plus_ver" >> $env:GITHUB_ENV
        echo "PLUS_URL=$plus_url" >> $env:GITHUB_ENV
        echo "TAG=$tag" >> $env:GITHUB_ENV
        
        # Skip version check on manual dispatch
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          echo "Manual dispatch detected — skipping version check"
          echo "EXISTS=false" >> $env:GITHUB_ENV
        } else {
          try {
            Invoke-RestMethod "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" -Headers @{Authorization="Bearer $env:GITHUB_TOKEN"}
            echo "EXISTS=true" >> $env:GITHUB_ENV
          } catch {
            echo "EXISTS=false" >> $env:GITHUB_ENV
          }
        }
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - uses: actions/checkout@v4
      if: env.EXISTS == 'false'

    - name: Build
      if: env.EXISTS == 'false'
      run: |
        curl -sSL "${{ env.THORIUM_URL }}" -o thorium.zip
        curl -sSL "${{ env.PLUS_URL }}" -o chrome_plus.7z
        curl -sSL https://www.7-zip.org/a/7zr.exe -o 7zr.exe
        
        Expand-Archive -Path thorium.zip -DestinationPath thorium_extracted -Force
        ./7zr.exe x chrome_plus.7z
        
        New-Item -Force -Type Directory Thorium_Portable | Out-Null
        
        # Get the extracted thorium folder
        $thoriumDir = Get-ChildItem thorium_extracted -Directory | Select-Object -First 1
        Copy-Item "$($thoriumDir.FullName)\*" Thorium_Portable\ -Recurse -Force
        
        # Copy version.dll from Chrome++ x64
        $dll = Get-ChildItem -Recurse version.dll | Where-Object { $_.FullName -match '\\x64\\App\\' }
        Copy-Item $dll[0].FullName Thorium_Portable\ -Force
        
        # Copy config files
        Copy-Item thorium++.ini,default-apps-multi-profile.bat,update.bat Thorium_Portable\ -Force
        
        # Write version file for update.bat
        Set-Content -Path "Thorium_Portable\version.txt" -Value "${{ env.THORIUM_VER }}"
        
        Compress-Archive Thorium_Portable "${{ env.TAG }}.zip" -Force
        echo "ZIP=${{ env.TAG }}.zip" >> $env:GITHUB_ENV

    - name: Release
      if: env.EXISTS == 'false'
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.ZIP }}
        tag_name: ${{ env.TAG }}
        name: Thorium ${{ env.THORIUM_VER }} + Chrome++ ${{ env.PLUS_VER }}
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
